<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 포털</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f6fa;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px;
    }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 28px; font-weight: 700; }
    header p { margin-top: 8px; color: #6b7280; font-size: 15px; }

    main { width: 100%; max-width: 640px; display: grid; gap: 28px; }

    section h2 {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.05em;
      margin: 0 0 10px 4px;
    }
    ul { list-style: none; display: grid; gap: 10px; }

    a.item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    a.item:hover, a.item:focus-visible {
      border-color: #2563eb;
      box-shadow: 0 4px 14px rgba(37, 99, 235, .12);
      transform: translateY(-1px);
      outline: none;
    }
    .icon {
      flex: none;
      width: 42px; height: 42px;
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 20px;
    }
    .news .icon { background: #e0ecff; }
    .work .icon { background: #e3f6ec; }
    .text { flex: 1; }
    .text strong { display: block; font-size: 16px; }
    .text span { font-size: 13px; color: #6b7280; }
    .arrow { color: #9ca3af; font-size: 18px; }

    footer { margin-top: 48px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>업무 포털</h1>
    <p>사용할 기능을 선택하세요</p>
  </header>

  <main>
    <section class="news">
      <h2>뉴스</h2>
      <ul>
        <li>
          <a class="item" href="https://script.google.com/macros/s/AKfycbyWKVQ4jxzB8Xf8ywEuiSUC1FmNGnsb4mpFFRJ4N6b1H8A3ZB0FI2HozjUscbl3hVKP/exec">
            <div class="icon">📰</div>
            <div class="text">
              <strong>한전뉴스대시보드</strong>
              <span>한전 관련 뉴스 모아보기</span>
            </div>
            <div class="arrow">›</div>
          </a>
        </li>
      </ul>
    </section>

    <section class="work">
      <h2>업무</h2>
      <ul>
        <li>
          <a class="item" href="PDF_병합기.html">
            <div class="icon">📄</div>
            <div class="text">
              <strong>PDF 병합도구</strong>
              <span>여러 PDF 파일을 하나로 합치기</span>
            </div>
            <div class="arrow">›</div>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer>© 업무 포털</footer>
</body>
</html>
